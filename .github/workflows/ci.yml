name: Repository & Data Integrity CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow pyyaml

      - name: Syntax check all source and script files
        run: python -m compileall -q src scripts

      - name: Run dataset, config, and repository hygiene checks
        run: python scripts/verify_reproduction.py
